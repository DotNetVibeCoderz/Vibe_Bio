# Biotech.Net CI: builds the Rust crate (biotech-native) for win-x64 / linux-x64 / osx-arm64, runs the full
# .NET test suite on Windows and Linux, and packs every Gravicode.Biotech.Net.* package with all native binaries.
#
# Lives at the repository root because GitHub only reads `.github/workflows/` there; the project itself is
# the `Biotech.Net/` subfolder of the Vibe_Bio monorepo, hence the path filters and working directory.
# Source copy: Biotech.Net/build/workflows/, copied to the monorepo root .github/workflows/.
name: Biotech.Net CI

on:
  push:
    branches: [main]
    paths: ["Biotech.Net/**", ".github/workflows/biotechnet-*.yml"]
  pull_request:
    paths: ["Biotech.Net/**", ".github/workflows/biotechnet-*.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Package version (empty = Directory.Build.props VersionPrefix)
        type: string
        default: ""

permissions:
  contents: read

defaults:
  run:
    working-directory: Biotech.Net

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Rust ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,   os: windows-latest, prefix: "",    ext: dll }
          - { rid: linux-x64, os: ubuntu-latest,  prefix: "lib", ext: so }
          - { rid: osx-arm64, os: macos-latest,   prefix: "lib", ext: dylib }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        working-directory: Biotech.Net/native/biotech-native
        run: cargo test --release
      - name: cargo build
        working-directory: Biotech.Net/native/biotech-native
        run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: Biotech.Net/native/biotech-native/target/release/${{ matrix.prefix }}biotech_native.${{ matrix.ext }}
          if-no-files-found: error

  test:
    name: .NET tests (${{ matrix.os }})
    needs: native
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          merge-multiple: true
          path: Biotech.Net/native/biotech-native/target/release
      - name: Build
        run: dotnet build Biotech.Net.slnx -c Release -p:SkipRustBuild=true
      - name: Test
        run: dotnet test Biotech.Net.slnx -c Release --no-build

  pack:
    name: Pack
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          merge-multiple: true
          path: Biotech.Net/native/biotech-native/target/release
      - name: Pack every library
        shell: bash
        run: |
          version_arg=""
          if [ -n "${{ inputs.version }}" ]; then version_arg="-p:Version=${{ inputs.version }}"; fi
          for p in src/*/*.csproj; do
            dotnet pack "$p" -c Release -p:SkipRustBuild=true -p:ContinuousIntegrationBuild=true $version_arg -o artifacts/packages
          done
          ls -la artifacts/packages
      - name: Check native binaries are packed
        shell: bash
        run: |
          pkg=$(ls artifacts/packages/Gravicode.Biotech.Net.Native.*.nupkg | grep -v snupkg)
          for f in runtimes/win-x64/native/biotech_native.dll runtimes/linux-x64/native/libbiotech_native.so runtimes/osx-arm64/native/libbiotech_native.dylib; do
            unzip -l "$pkg" | grep -q "$f" || { echo "::error::$f missing from $pkg"; exit 1; }
          done
      - uses: actions/upload-artifact@v7
        with:
          name: biotechnet-packages
          path: Biotech.Net/artifacts/packages/*
          if-no-files-found: error
